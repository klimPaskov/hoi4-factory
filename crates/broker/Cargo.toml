[package]
name = "factory-broker"
description = "HOI4 Factory tool broker: C-08 grants, closed schema validation, user API keys and metering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
factory-accounts = { path = "../accounts" }
factory-workspace = { path = "../workspace" }
sqlx = { workspace = true, features = ["json"] }
jsonschema = { version = "0.60.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["time", "sync"] }
