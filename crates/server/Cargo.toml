[package]
name = "factory-server"
description = "HOI4 Factory web server and workspace host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "factory_server"
path = "src/lib.rs"

[[bin]]
name = "factory-server"
path = "src/main.rs"

[dependencies]
factory-accounts = { path = "../accounts" }
factory-workspace = { path = "../workspace" }
factory-game-ref = { path = "../game-ref" }
axum.workspace = true
tokio = { workspace = true, features = ["net", "time", "sync", "fs"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "fs", "catch-panic"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "env-filter", "fmt"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile.workspace = true
