[package]
name = "factory-server"
description = "HOI4 Factory web server and workspace host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "factory_server"
path = "src/lib.rs"

[[bin]]
name = "factory-server"
path = "src/main.rs"

[dependencies]
factory-accounts = { path = "../accounts" }
factory-workspace = { path = "../workspace" }
factory-game-ref = { path = "../game-ref" }
factory-intake = { path = "../intake" }
factory-setup-adapter = { path = "../setup-adapter" }
factory-agent = { path = "../agent", default-features = false, features = ["anthropic", "openai", "protocol", "worker"] }
factory-tasks = { path = "../tasks" }
factory-broker = { path = "../broker" }
factory-hoi4-tools = { path = "../hoi4-tools" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
axum = { workspace = true, features = ["multipart"] }
async-trait.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["net", "time", "sync", "fs", "io-util", "process", "io-std", "rt"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "fs", "catch-panic"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "env-filter", "fmt"] }
url = "2"

[dev-dependencies]
factory-agent = { path = "../agent", features = ["testing", "worker"] }
# The gate tests drive Setup's transaction engine and plan builder directly (fault injection, a
# child process that applies), next to the HTTP flow.
hoi4-mod-setup.workspace = true
http-body-util = "0.1"
# The GitHub test double and the raw ZIP writer are the intake crate's own test support
# (crates/intake/tests/common), included by path; these are the crates it needs.
base64 = "0.22"
crc32fast = "1"
flate2 = "1"
jsonwebtoken = "9"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
