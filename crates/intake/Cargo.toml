[package]
name = "factory-intake"
description = "HOI4 Factory upload intake (ZIP and folder) and GitHub App import into server workspaces. No push, no pull request."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
factory-workspace = { path = "../workspace" }
async-trait.workspace = true
base64 = "0.22"
chrono.workspace = true
crc32fast = "1"
flate2 = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["json"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time", "sync"] }
tracing.workspace = true
unicode-normalization.workspace = true
url = "2"
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time", "sync", "net", "io-util"] }
