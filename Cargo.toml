[workspace]
resolver = "3"
members = ["crates/server", "crates/agent", "crates/setup-adapter", "crates/accounts", "crates/workspace", "crates/game-ref", "crates/intake", "crates/tasks", "crates/broker", "crates/hoi4-tools", "probes/runtime"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/klimPaskov/hoi4-factory"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
thiserror = "2"
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "chrono"] }
argon2 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tracing = "0.1"

# ---------------------------------------------------------------------------------------------
# HOI4-Mod-Setup pin. This is the ONE place to bump when the upstream pull requests merge:
# change `rev` below and the metadata table after it, then run `cargo update -p hoi4-mod-setup`.
# crates/setup-adapter/build.rs reads both and bakes them into `factory_setup_adapter::SETUP_PIN`,
# so gates can tell which Setup revision is running and whether it has the PR 105 fix.
# `default-features = false` drops `os-keyring` (libdbus) and `desktop` (Tauri).
hoi4-mod-setup = { git = "https://github.com/klimPaskov/HOI4-Mod-Setup", rev = "c28198bb9b4d3fd90cea294cf136cad357ed5bbc", default-features = false }
# Setup's analysis contract (output schema, provider request builder). Same rev as above; a test checks they agree.
hoi4-setup-core = { git = "https://github.com/klimPaskov/HOI4-Mod-Setup", rev = "c28198bb9b4d3fd90cea294cf136cad357ed5bbc" }

[workspace.metadata.hoi4-mod-setup-pin]
repository = "klimPaskov/HOI4-Mod-Setup"
# The branch and pull request the revision above belongs to (informational).
branch = "main"
pull_request = "merged: #105 recovery fix, #106 service facade, #107 finalizing recovery fix, #108 DefaultPlanBuilder"
# Whether the revision contains the PR 105 recovery fix (a300b90439fcf907b9e684f3df8443322d7b7848,
# placement temporaries bound to the transaction). Set true only for a merged revision that has it.
contains_pr_105_fix = true
pr_105_head = "a300b90439fcf907b9e684f3df8443322d7b7848"
# Whether the revision ships a default PlanBuilder. False until the plan-builder pull request lands.
default_plan_builder = true
