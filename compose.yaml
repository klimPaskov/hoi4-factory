# HOI4 Factory development services: server, PostgreSQL and Mailpit (development mail).
#
# Start:   scripts/compose.sh up -d --build --wait
# Stop:    scripts/compose.sh down      (add -v only to delete the database and workspaces)
#
# Required: HOI4_GAME_DIR, the host folder of a Hearts of Iron IV install (the folder that
# holds launcher-settings.json and dlc/). It is bind-mounted read-only at /game and only
# identity metadata is read from it. scripts/compose.sh finds it in this machine's Steam
# libraries on Windows, macOS and Linux, so one .env works on every machine. Set it in the shell
# or in the git-ignored .env only for an install outside Steam; a value that does not exist on
# this machine is ignored by the script. Plain `docker compose` needs it set, for example:
#
#   Windows: HOI4_GAME_DIR=C:/Program Files (x86)/Steam/steamapps/common/Hearts of Iron IV
#   macOS:   HOI4_GAME_DIR=/Users/<you>/Library/Application Support/Steam/steamapps/common/Hearts of Iron IV
#
# Required: the GitHub App private key file, ./.work/github-app/private-key.pem (git-ignored). It is
# bind-mounted read-only at /run/secrets/github-app-key.pem. To use another location set
# FACTORY_GITHUB_APP_KEY_FILE; to run without GitHub, point it at any empty file.
#
# Optional: FACTORY_ANTHROPIC_API_KEY (host environment, for Setup analysis and the operator-funded
# agent allowance) and FACTORY_ANTHROPIC_MODEL.
#
# Key encryption: ./.work/secrets/factory-secret.key (git-ignored, 32 random bytes in base64)
# encrypts the model API keys users save. scripts/compose.sh creates it on first use. Mounted
# read-only at /run/secrets/factory-secret.key; set FACTORY_SECRET_KEY_SOURCE for another location.
#
# Optional: FACTORY_OUTBOUND_ALLOW_CIDRS, comma-separated address ranges that custom model
# endpoints may use although they are private (for example a self-hosted model server on this
# network). Empty by default: private, loopback, link-local and metadata addresses are refused.
#
# Optional: FACTORY_HOST_PORT (default 8080), MAILPIT_UI_PORT (default 8025),
# FACTORY_ALLOWED_ORIGINS (default: a Vite dev server on port 5173).
#
# Existing db volumes created before docker/db-init existed lack the factory_server role.
# Recreate them once with `docker compose down -v`.
name: hoi4-factory

services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports:
      - "127.0.0.1:${FACTORY_HOST_PORT:-8080}:8080"
    environment:
      FACTORY_ENV: development
      FACTORY_LISTEN: "0.0.0.0:8080"
      FACTORY_PUBLIC_URL: "http://127.0.0.1:${FACTORY_HOST_PORT:-8080}"
      FACTORY_ALLOWED_ORIGINS: "${FACTORY_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      FACTORY_SMTP_URL: "smtp://mailpit:1025"
      FACTORY_DATA_ROOT: /data
      FACTORY_GAME_REF: /game
      # The server connects as a non-superuser member of factory_app; the owner role migrates.
      DATABASE_URL: "postgres://factory_server@db:5432/factory"
      DATABASE_MIGRATION_URL: "postgres://factory@db:5432/factory"
      # GitHub App (HOI4 Factory Dev). The private key is a read-only file mount, never an env value.
      # Without the key file's content the GitHub routes report unavailable and nothing else changes.
      FACTORY_GITHUB_APP_ID: "5453675"
      FACTORY_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app-key.pem
      # GitHub sign-in uses the same App's user authorization. The client ID is public and is set only
      # when a client secret is given, so the server never starts with half of the pair. Callback URL
      # to register on the App: <FACTORY_PUBLIC_URL>/api/v1/auth/github/callback.
      FACTORY_GITHUB_CLIENT_ID: "${FACTORY_GITHUB_CLIENT_SECRET:+Iv23livHYmk20NUtVFue}"
      FACTORY_GITHUB_CLIENT_SECRET: "${FACTORY_GITHUB_CLIENT_SECRET:-}"
      # Setup analysis model. The key is passed from the host environment (never baked into the image,
      # never logged); an empty value leaves analysis unavailable. Model default: claude-haiku-5-5.
      FACTORY_ANTHROPIC_API_KEY: "${FACTORY_ANTHROPIC_API_KEY:-}"
      FACTORY_ANTHROPIC_MODEL: "${FACTORY_ANTHROPIC_MODEL:-}"
      # Agent (S03): user key encryption, the outbound destination policy and the monthly allowance
      # per verified account in micro-dollars (1000000 = $1, the maintainer's setting).
      FACTORY_SECRET_KEY_FILE: /run/secrets/factory-secret.key
      FACTORY_OUTBOUND_ALLOW_CIDRS: "${FACTORY_OUTBOUND_ALLOW_CIDRS:-}"
      FACTORY_ALLOWANCE_MICROS: "${FACTORY_ALLOWANCE_MICROS:-1000000}"
    volumes:
      - workspace-data:/data
      - type: bind
        source: "${FACTORY_GITHUB_APP_KEY_FILE:-./.work/github-app/private-key.pem}"
        target: /run/secrets/github-app-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${FACTORY_SECRET_KEY_SOURCE:-./.work/secrets/factory-secret.key}"
        target: /run/secrets/factory-secret.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${HOI4_GAME_DIR:?Set HOI4_GAME_DIR to the Hearts of Iron IV game folder, for example in a git-ignored .env file}"
        target: /game
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    # An init process reaps the agent's workers and tool processes (and anything they leave
    # behind when a process group is killed); factory-server as PID 1 would leave zombies.
    init: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_USER: factory
      POSTGRES_DB: factory
      # Development only. The database port is not published outside the Compose network.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates factory_app and the non-superuser factory_server login role (first start only).
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "factory"]
      interval: 2s
      retries: 30

  # Development mail. Sign-up and password-reset links land here: http://127.0.0.1:8025
  # (API: http://127.0.0.1:8025/api/v1/messages). SMTP (1025) is reachable inside the
  # Compose network only. Messages are kept in memory and vanish on restart.
  mailpit:
    image: axllent/mailpit:v1.29@sha256:757f22b56c1da03570afdb3d259effe5091018008a81bbedc8158cee7e16fdbc
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db-data:
  workspace-data:
