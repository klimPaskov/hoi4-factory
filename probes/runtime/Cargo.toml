[package]
name = "factory-runtime-probe"
description = "S01 EXP-03/EXP-04 runtime probes: host broker, effect journal, worker supervisor, stream fault replay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "runtime-probe"
path = "src/main.rs"

[dependencies]
factory-agent = { path = "../../crates/agent" }
bytes = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "io-std", "fs", "net", "time", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
jsonschema = { version = "0.60.1", default-features = false }
sha2 = "0.10"
