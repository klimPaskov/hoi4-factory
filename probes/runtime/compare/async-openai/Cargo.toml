# S01 comparison crate: the same streamed tool-call turn through async-openai.
# Standalone workspace so its dependencies stay out of the product lockfile.
[package]
name = "compare-async-openai"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
async-openai = { version = "=0.42.2", default-features = false, features = ["rustls", "chat-completion"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
